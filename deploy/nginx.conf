worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 32m;
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    "" $request_id;
  }

  upstream www_app { server www:3000; keepalive 16; }
  upstream admin_app { server admin:3001; keepalive 16; }
  upstream api_app { server api:4000; keepalive 32; }
  upstream minio_upstream { server minio:9000; keepalive 8; }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $req_id;

  server {
    listen 80;
    server_name www.localhost www.visitworlds.me localhost;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/api/www/conversations/[^/]+/chat$ {
      proxy_pass http://api_app;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      chunked_transfer_encoding on;
      add_header X-Accel-Buffering no;
      proxy_set_header Connection "";
    }

    location /api/ {
      proxy_pass http://api_app;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    location /capability-center/ {
      proxy_pass http://minio_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      client_max_body_size 32m;
    }

    location /_next/static/ {
      proxy_pass http://www_app;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://www_app;
      proxy_read_timeout 60s;
    }
  }

  server {
    listen 81;
    server_name admin.localhost admin.visitworlds.me;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
      proxy_pass http://api_app;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://admin_app;
    }
  }

  server {
    listen 82;
    server_name api.localhost api.visitworlds.me;
    client_max_body_size 32m;

    location /mcp {
      proxy_pass http://api_app;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_set_header Connection "";
    }

    location / {
      proxy_pass http://api_app;
      proxy_read_timeout 120s;
    }
  }
}
