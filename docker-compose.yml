services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: capability_center
      MYSQL_USER: cc
      MYSQL_PASSWORD: cc_pass_local
      MYSQL_ROOT_PASSWORD: root_pass_local
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pass_local"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/bitnami/minio/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: local
      PORT: "4000"
      DATABASE_URL: mysql://cc:cc_pass_local@mysql:3306/capability_center
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-me
      API_KEY_PEPPER: dev-pepper
      COOKIE_SECURE: "false"
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.xytoken.xyb2b.com/v1}
      XY_BASE_URL: ${XY_BASE_URL:-https://api.xytoken.xyb2b.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      XY_API_KEY: ${XY_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4.1-flash}
      LINKFOX_API_KEY: ${LINKFOX_API_KEY:-}
      LINKFOXAGENT_API_KEY: ${LINKFOXAGENT_API_KEY:-}
      LINKFOX_AGENT_API_KEY: ${LINKFOX_AGENT_API_KEY:-${LINKFOXAGENT_API_KEY:-}}
      LINKFOX_TOOL_GATEWAY: ${LINKFOX_TOOL_GATEWAY:-https://tool-gateway.linkfox.com}
      CHATHUB_BASE_URL: ${CHATHUB_BASE_URL:-}
      CHATHUB_API_KEY: ${CHATHUB_API_KEY:-}
      CHATHUB_MODEL: ${CHATHUB_MODEL:-}
      TRADEMARK_MCP_URL: ${TRADEMARK_MCP_URL:-https://ipunique.com/mcp}
      TRADEMARK_MCP_TOKEN: ${TRADEMARK_MCP_TOKEN:-}
      TRADEMARK_MCP_REFRESH_TOKEN: ${TRADEMARK_MCP_REFRESH_TOKEN:-}
      TRADEMARK_MCP_CLIENT_ID: ${TRADEMARK_MCP_CLIENT_ID:-}
      TRADEMARK_MCP_TOKEN_URL: ${TRADEMARK_MCP_TOKEN_URL:-https://ipunique.com/api/oauth/token}
      TRADEMARK_MCP_RESOURCE: ${TRADEMARK_MCP_RESOURCE:-https://ipunique.com/mcp}
      OSS_PROVIDER: minio
      OSS_ENDPOINT: http://minio:9000
      OSS_PUBLIC_ENDPOINT: http://localhost:8888
      OSS_REGION: us-east-1
      OSS_BUCKET: capability-center
      OSS_ACCESS_KEY_ID: minioadmin
      OSS_ACCESS_KEY_SECRET: minioadmin
      OSS_PREFIX: capability-center
      OSS_SIGNED_URL_EXPIRES: "3600"
      OSS_PUBLIC_READ: "false"
      OSS_FORCE_PATH_STYLE: "true"
      SEED_ADMIN_EMAIL: admin@visitworlds.me
      SEED_ADMIN_PASSWORD: Admin123456
      SEED_OPS_EMAIL: ops@visitworlds.me
      SEED_OPS_PASSWORD: Ops123456
      SEED_DEMO_EMAIL: demo@visitworlds.me
      SEED_DEMO_PASSWORD: Demo123456
      SEED_API_KEY: ck_sandbox_demo01_capabilitycenterdevsecret
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  www:
    build:
      context: .
      dockerfile: apps/www/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8888:80"
      - "8889:81"
      - "8890:82"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      www:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  minio_data:
